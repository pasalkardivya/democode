spring.application.name=Lodgings
server.port=8080

# ===== H2 In-Memory Database (for development / zero-config) =====
spring.datasource.url=jdbc:h2:file:C:/Users/Pradnya Pasalkar/OneDrive/Attachments/python/java/blog/Lodgings/data/lodgings_db;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# ===== API Partner Key =====
api.partner.key=lodgings-partner-key-2024

